useEffect(()=>{

    setClients(localDB);

        const u = localDB.find(c=>c.ph===storedPhone);
        if(u) { setCurrentUser(u); setView('client'); } 
    } else if (!storedPhone) { setView('login'); }

    const unsub = db.collection('elite_clients').onSnapshot(s=>{
        const fbData = s.docs.map(d=>({id:d.id,...d.data()})); 
        let merged = [...localDB];
        fbData.forEach(fbC => { const idx = merged.findIndex(lc => lc.ph === fbC.ph); if(idx === -1) merged.push(fbC); else merged[idx] = {...merged[idx], ...fbC}; });
        localStorage.setItem('gg_local_clients_db', JSON.stringify(merged)); 
        setClients(merged);

            const u = merged.find(c=>c.ph===storedPhone); if(u) setCurrentUser(u);
        }

        const annDoc=fbData.find(c=>c.id==='system_ann');if(annDoc){setAnn(annDoc.text);setTip(annDoc.tip||'');}
        const confDoc=fbData.find(c=>c.id==='system_config');
        if(confDoc){
            if(confDoc.measurePts) setMeasurePts(confDoc.measurePts);
            if(confDoc.sysConf) setSysConf({...sysConf, ...confDoc.sysConf});
        }

const handleTouchEndEvent = () => {
    if (!touchStart || !touchEnd) return;
    const distance = touchStart - touchEnd;
    const minSwipeDistance = 50;
    const tabs = ['home', 'workout', 'diet', 'settings'];
    const currentIdx = tabs.indexOf(clientTab);
    if (distance > minSwipeDistance && currentIdx < tabs.length - 1) setClientTab(tabs[currentIdx + 1]);
    if (distance < -minSwipeDistance && currentIdx > 0) setClientTab(tabs[currentIdx - 1]);
};

const handleCheckIn = (type, tdStr, wakeTgt) => {
    const now = new Date(); const timeStr = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
    const log = currentUser.dailyLog?.[tdStr] || {};
    if(type==='wake'){ 
        const nowMins = now.getHours()*60 + now.getMinutes();
        const tgtMins = getMins(wakeTgt||'07:00');
        const diff = nowMins - tgtMins;
        let status = '';
        if(diff < -30) status = isAr?'بدري 🌟':'Early 🌟';
        else if(diff <= 30) status = isAr?'في الموعد 🎯':'On Time 🎯';
        else status = isAr?'متأخر ⏰':'Late ⏰';
        updateDB({...currentUser, dailyLog:{...currentUser.dailyLog, [tdStr]:{...log, wakeTime: timeStr, wakeStatus: status}}});
    } else if(type==='gym'){ updateDB({...currentUser, dailyLog:{...currentUser.dailyLog, [tdStr]:{...log, gymTime: timeStr}}}); }
};

                        <a href={`https://wa.me/2${ADMIN_PHONE}?text=${encodeURIComponent(isAr?`أهلاً كابتن، بعتذر مش هقدر اتمرن النهاردة..`:`Hi Coach, I won't be able to workout today.`)}`} target="_blank" className="w-full py-3 rounded-2xl font-black text-xs shadow-sm bg-red-50 dark:bg-red-900/20 text-red-600 border border-red-200 dark:border-red-800 text-center flex items-center justify-center mt-2">{isAr?'اعتذار عن التمرين ⚠️':'Skip Workout ⚠️'}</a>

                        {(!tdPlan?.workout||tdPlan?.workout.includes('راحة')||tdPlan?.workout.includes('Rest')||tdPlan?.workout.includes('Off'))?(<div className="text-center py-10 bg-white dark:bg-slate-800 rounded-3xl shadow-sm border dark:border-slate-700"><div className="text-5xl mb-4 animate-pulse">🌿</div><p className="font-black text-lg">{isAr?'يوم راحة واستشفاء':'Rest Day'}</p></div>):(
                            <div className="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-sm border dark:border-slate-700 mt-4">
                                <h4 className="text-brand font-black mb-4 flex items-center gap-2"><span>🏋️‍♀️</span> {isAr?'قائمة التمارين':'Exercises List'}</h4>
                                <div className="space-y-1">{renderChecklist(tdPlan.workout, 'workout', tdStr, currentUser)}</div>
                            </div>
                        )}
                    </div>
                )}

                {/* 3. DIET TAB */}
                {clientTab === 'diet' && (
                    <div className="animate-slide-up space-y-4">
                        
                        {currentUser.inbodyNotes && (
                            <div className="bg-blue-50 dark:bg-blue-900/30 p-4 rounded-3xl shadow-sm border border-blue-200 dark:border-blue-800">
                                <h4 className="font-black text-blue-700 dark:text-blue-300 text-sm mb-2">📝 {isAr?'ملاحظات وقراءة كابتن روان':'Coach Notes'}</h4>
                                <p className="text-xs font-bold text-blue-900 dark:text-blue-100 whitespace-pre-wrap leading-relaxed">{currentUser.inbodyNotes}</p>
                            </div>
                        )}

                        <div className="bg-gradient-to-r text-white p-5 rounded-3xl shadow-lg border border-white/20">
                            <h3 className="font-black text-lg mb-4 flex items-center gap-2"><span>🥗</span> {isAr?'أهدافك الغذائية اليومية':'Daily Nutrition Goals'}</h3>
                            <div className="flex justify-between items-center bg-black/20 p-3 rounded-2xl">
                                <div className="text-center"><span className="block text-[10px] opacity-80">Cal</span><span className="font-black text-xl text-brand-gold">{macs.c}</span></div>
                                <div className="text-center"><span className="block text-[10px] opacity-80">Pro</span><span className="font-bold text-lg">{macs.p}g</span></div>
                                <div className="text-center"><span className="block text-[10px] opacity-80">Carb</span><span className="font-bold text-lg">{macs.cr}g</span></div>
                                <div className="text-center"><span className="block text-[10px] opacity-80">Fat</span><span className="font-bold text-lg">{macs.f}g</span></div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3 mb-2">
                            <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl border border-blue-100 dark:border-blue-800 text-center">
                                <span className="block text-2xl mb-1">💧</span><span className="font-black text-blue-700 dark:text-blue-400 text-xs">{isAr?'شرب':'Drink'} {activeWater} {isAr?'لتر':'L'}</span>
                            </div>
                            <div className="bg-yellow-50 dark:bg-yellow-900/20 p-4 rounded-2xl border border-yellow-100 dark:border-yellow-800 text-center">
                                <span className="block text-2xl mb-1">💊</span><span className="font-black text-yellow-700 dark:text-yellow-400 text-[10px]">{activeVits}</span>
                            </div>
                        </div>

                        {tdPlan?.diet ? (
                            <div className="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-sm border dark:border-slate-700 mt-2">
                                <h4 className="text-green-600 dark:text-green-400 font-black mb-4 flex items-center gap-2"><span>🥑</span> {isAr?'الوجبات':'Meals'}</h4>
                                <div className="space-y-1">{renderChecklist(tdPlan.diet, 'diet', tdStr, currentUser, activeMealStr)}</div>
                            </div>
                        ) : (
                            <div className="text-center py-10 bg-white dark:bg-slate-800 rounded-3xl shadow-sm"><p className="font-black">{isAr?'لا يوجد دايت مسجل اليوم.':'No diet plan today.'}</p></div>
                        )}
                    </div>
                )}

                {/* 4. SETTINGS TAB */}
                {clientTab === 'settings' && (
                    <div className="animate-slide-up space-y-4">
                        <h3 className="font-black text-2xl text-brand mb-4">{txt.tSet} ⚙️</h3>

                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <button onClick={toggleT} className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 font-black flex items-center justify-center gap-2">{isAr?'وضع الشاشة':'Theme'} {theme==='dark'?'☀️':'🌙'}</button>
                            <button onClick={toggleL} className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 font-black flex items-center justify-center gap-2">{isAr?'اللغة':'Language'} {lang==='ar'?'EN':'AR'}</button>
                        </div>
                        
                        <div className="bg-white dark:bg-slate-800 p-5 rounded-3xl shadow-sm border dark:border-slate-700 space-y-4">
                            <h4 className="font-bold text-sm text-gray-500">{isAr?'تحديث بياناتي':'Update Info'}</h4>
                            <div><label className="text-[10px] font-bold block mb-1">{txt.n}</label><input type="text" className="w-full p-3 rounded-xl border bg-input font-bold" value={currentUser.n} onChange={e=>setCurrentUser(p=>({...p,n:e.target.value}))}/></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-[10px] font-bold block mb-1">{txt.w} (kg)</label><input type="number" className="w-full p-3 rounded-xl border bg-input font-bold text-center" value={currentUser.w} onChange={e=>setCurrentUser(p=>({...p,w:e.target.value}))}/></div>
                                <div><label className="text-[10px] font-bold block mb-1">{txt.h} (cm)</label><input type="number" className="w-full p-3 rounded-xl border bg-input font-bold text-center" value={currentUser.h} onChange={e=>setCurrentUser(p=>({...p,h:e.target.value}))}/></div>
                            </div>
                            <button onClick={()=>{
                                updateDB(currentUser);
                                setShowWeightSuccess(true);
                                setTimeout(()=>setShowWeightSuccess(false), 3500);
                            }} className="w-full bg-brand text-white py-3 rounded-xl font-black shadow-md mt-2">{isAr?'حفظ التعديلات 💾':'Save 💾'}</button>
                        </div>

                        <div className="bg-white dark:bg-slate-800 p-5 rounded-3xl shadow-sm border dark:border-slate-700">
                            <h4 className="font-bold text-sm mb-3 text-gray-500">{isAr?'اختر صورتك (Avatar)':'Choose Avatar'}</h4>
                            <div className="flex flex-wrap gap-3 justify-center mb-4 bg-gray-50 dark:bg-slate-900 p-3 rounded-2xl">
                                {EMOJIS.map(e=>(<span key={e} onClick={()=>{const nU={...currentUser,avatar:e};setCurrentUser(nU);updateDB(nU);}} className={`text-3xl cursor-pointer transition hover:scale-110 ${currentUser.avatar===e?'bg-brand/20 rounded-xl p-1':''}`}>{e}</span>))}
                            </div>
                        </div>

                        <button onClick={logout} className="w-full text-center py-4 font-bold text-red-500">{isAr?'تسجيل الخروج':'Logout'}</button>
                    </div>
                )}
            </div>

            {/* Weight Success Modal */}
            {showWeightSuccess && (
                <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 pointer-events-none">
                    <div className="bg-green-500 text-white p-6 rounded-3xl shadow-2xl flex flex-col items-center animate-slide-up text-center border-4 border-white">
                        <span className="text-6xl mb-2 animate-bounce">🎉</span>
                        <h3 className="font-black text-xl mb-1">{isAr?'عااااش يا بطلة!':'Great Job!'}</h3>
                        <p className="text-sm font-bold">{isAr?`خطوة ممتازة نحو وزنك المثالي (${iW} كجم) 🎯`:`A great step towards your ideal weight (${iW} kg) 🎯`}</p>
                    </div>
                </div>
            )}

            {/* Profile Modal */}
            {showProfileModal && (
                <div className="fixed inset-0 bg-black/80 z-[70] flex items-center justify-center animate-zoom-in p-4">
                    <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] p-6 relative border border-white/10 shadow-2xl overflow-hidden">
                        <button onClick={()=>{setShowProfileModal(false);}} className="absolute top-4 right-4 bg-gray-200 dark:bg-slate-700 w-8 h-8 rounded-full font-bold z-10">✕</button>
                        <div className="text-center mb-6 pt-4">
                            <div className="w-20 h-20 bg-brand text-white rounded-full flex items-center justify-center text-4xl shadow-md border-4 border-white dark:border-slate-700 mx-auto mb-3">{currentUser.avatar||'👑'}</div>
                            <h3 className="font-black text-2xl text-brand">{currentUser.n}</h3>
                            <p className="text-xs font-bold text-gray-500">{currentUser.ph}</p>
                        </div>
                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <div className="bg-gray-50 dark:bg-slate-900 p-3 rounded-2xl text-center border dark:border-slate-700"><span className="block text-[10px] text-gray-500 mb-1">{isAr?'العمر':'Age'}</span><span className="font-black text-lg">{calcAge(currentUser.dob)}</span></div>
                            <div className="bg-gray-50 dark:bg-slate-900 p-3 rounded-2xl text-center border dark:border-slate-700"><span className="block text-[10px] text-gray-500 mb-1">{isAr?'فصيلة الدم':'Blood'}</span><span className="font-black text-lg text-red-500">{currentUser.bType||'-'}</span></div>
                            <div className="bg-gray-50 dark:bg-slate-900 p-3 rounded-2xl text-center border dark:border-slate-700"><span className="block text-[10px] text-gray-500 mb-1">{isAr?'الطول':'Height'}</span><span className="font-black text-lg">{currentUser.h} cm</span></div>
                            <div className="bg-brand/10 p-3 rounded-2xl text-center border border-brand/20"><span className="block text-[10px] text-brand mb-1">{isAr?'الوزن المثالي':'Ideal Wt'}</span><span className="font-black text-lg text-brand">{iW} kg</span></div>
                        </div>
                        <div className="bg-gray-50 dark:bg-slate-900 p-4 rounded-2xl border dark:border-slate-700 mb-4">
                            <h4 className="font-bold text-xs mb-2 border-b pb-1">{isAr?'التاريخ الطبي 🩺':'Medical History 🩺'}</h4>
                            <p className="text-[10px] font-bold leading-relaxed opacity-80">
                                {currentUser.m1==='yes' && <span>• أمراض مزمنة: {currentUser.m1r}<br/></span>}
                                {currentUser.m2==='yes' && <span>• حمل/ولادة: {currentUser.m2r}<br/></span>}
                                {currentUser.m3==='yes' && <span>• مشاكل مفاصل: {currentUser.m3r}<br/></span>}
                                {currentUser.m4==='yes' && <span>• جراحات: {currentUser.m4r}<br/></span>}
                                {currentUser.m6==='yes' && <span>• وراثية: {currentUser.m6r}<br/></span>}
                                {(currentUser.injuries||[]).length > 0 && <span>• إصابات: {currentUser.injuries.join(', ')}</span>}
                                {currentUser.m1!=='yes' && currentUser.m2!=='yes' && currentUser.m3!=='yes' && currentUser.m4!=='yes' && currentUser.m6!=='yes' && (currentUser.injuries||[]).length === 0 && <span>{isAr?'لا يوجد تاريخ مرضي.':'No medical history.'}</span>}
                            </p>
                        </div>
                    </div>
                </div>
            )}

            {/* About Modal */}
            {showAboutModal && (
                <div className="fixed inset-0 bg-black/80 z-[70] flex items-center justify-center animate-zoom-in p-4">
                    <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] p-6 text-center relative border border-white/10 shadow-2xl overflow-hidden">
                        <button onClick={()=>{setShowAboutModal(false);}} className="absolute top-4 right-4 bg-gray-200 dark:bg-slate-700 w-8 h-8 rounded-full font-bold z-10">✕</button>
                        <div className="bg-brand/10 -mx-6 -mt-6 p-6 pb-8 mb-6 border-b border-brand/20">
                            <img src="logo.png" className="w-32 h-32 mx-auto drop-shadow-xl animate-bounce-slight" onError={e=>e.target.style.display='none'} />
                        </div>
                        <h3 className="font-black text-2xl text-brand mb-2">Coach Rawan 👑</h3>
                        <p className="text-xs font-bold text-gray-600 dark:text-gray-300 leading-relaxed mb-6">
                            {isAr ? 'مدربة معتمدة بخبرة عالية في التدريب الشخصي والتغذية. ساعدت العديد من المتدربات على تحقيق أهدافهن ونتائج مبهرة في وقت قياسي ببرامج مخصصة ومتابعة مستمرة. الجسد السليم يبدأ بقرار! 💪' : 'Certified personal trainer and nutritionist with vast experience. Helping clients achieve outstanding results in record time through customized plans. Your fitness journey starts here! 💪'}
                        </p>
                        <a href={`https://wa.me/2${ADMIN_PHONE}`} target="_blank" className="w-full bg-[#25D366] text-white py-4 rounded-xl font-black shadow-lg flex items-center justify-center gap-2 hover:scale-[1.02] transition">
                            <span className="text-xl">💬</span> {isAr?'تواصل مع الكابتن':'Contact Coach'}
                        </a>
                    </div>
                </div>
            )}

            <TimerModal isOpen={showTimer} onClose={()=>setShowTimer(false)} isAr={isAr} />
            <StopwatchModal isOpen={showStopwatch} onClose={()=>setShowStopwatch(false)} isAr={isAr} />

            {/* Music Modal */}
            {musicModal && (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-end justify-center animate-zoom-in p-4 pb-24">
                    <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-[2.5rem] p-6 text-center relative border border-white/10 shadow-2xl">
                        <button onClick={()=>{setMusicModal(false);}} className="absolute top-4 right-4 bg-gray-200 dark:bg-slate-700 w-8 h-8 rounded-full font-bold">✕</button>
                        <h3 className="font-black text-xl mb-6 text-brand">🎧 {isAr?'اختر موسيقى التمرين':'Music Selection'}</h3>
                        <div className="space-y-3 mb-6">
                            {[1,2,3].map(i=>{
                                const url = `https://www.soundhelix.com/examples/mp3/SoundHelix-Song-${i}.mp3`;
                                const isAct = actMusic===url;
                                return <button key={i} onClick={()=>playMusic(url)} className={`w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 border transition ${isAct?'bg-brand text-white border-brand animate-pulse':'bg-gray-50 dark:bg-slate-900 border-gray-200 dark:border-slate-700'}`}>{isAct?(isAr?'⏸️ إيقاف':'Pause'):('🎵 Gym Vibe '+i)}</button>;
                            })}
                        </div>
                        <div className="grid grid-cols-2 gap-3 pt-4 border-t dark:border-slate-700">
                            <a href="https://open.spotify.com/" target="_blank" className="bg-[#1DB954] text-white py-3 rounded-xl font-black flex justify-center items-center gap-2 shadow-lg"><img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" className="w-5 h-5"/> Spotify</a>
                            <a href="https://music.youtube.com/" target="_blank" className="bg-[#FF0000] text-white py-3 rounded-xl font-black flex justify-center items-center gap-2 shadow-lg"><img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" className="w-6 h-4"/> YT Music</a>
                        </div>
                    </div>
                </div>
            )}

            {/* Bottom Navigation Bar */}
            <div className="fixed bottom-0 left-0 w-full bg-white dark:bg-slate-900 border-t border-gray-100 dark:border-slate-800 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] flex justify-around p-2 z-40 pb-safe">
                <button onClick={()=>setClientTab('home')} className={`nav-btn ${clientTab==='home'?'active':''}`}><span className="icon">🏠</span><span>{txt.tHm}</span></button>
                <button onClick={()=>setClientTab('workout')} className={`nav-btn ${clientTab==='workout'?'active':''}`}><span className="icon">💪</span><span>{txt.tEx}</span></button>
                <button onClick={()=>setClientTab('diet')} className={`nav-btn ${clientTab==='diet'?'active':''}`}><span className="icon">🥗</span><span>{txt.tDt}</span></button>
                <button onClick={()=>setClientTab('settings')} className={`nav-btn ${clientTab==='settings'?'active':''}`}><span className="icon">⚙️</span><span>{txt.tSet}</span></button>
            </div>
            
        </div>
    );
}
return null;
};const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script></body></html>
