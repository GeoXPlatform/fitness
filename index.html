const formatCoachHours=(str,isAr)=>{if(!str||str==='إجازة'||str==='Off Day'||!str.includes(' - '))return(str==='إجازة'||str==='Off Day')?(isAr?'إجازة':'Off Day'):(str||(isAr?'إجازة':'Off Day'));const[from,to]=str.split(' - ');return`${formatTime12h(from)} - ${formatTime12h(to)}`;};
const isNowInCoachHours=(str)=>{if(!str||str==='إجازة'||str==='Off Day'||!str.includes(' - '))return false;const[from,to]=str.split(' - ');const[fh,fm]=from.split(':').map(Number);const[th,tm]=to.split(':').map(Number);if(isNaN(fh)||isNaN(th))return false;const now=new Date();const cur=now.getHours()*60+now.getMinutes();const start=fh*60+(fm||0);const end=th*60+(tm||0);return start<=end?(cur>=start&&cur<=end):(cur>=start||cur<=end);};

const formatWorkoutItemByLang=(text,isAr)=>{
  if(!text)return'';
  let cleanText=String(text).replace(/\s*\{\{بديل_الهدوء:.*?\}\}/g,'').replace(/\[بدلاً من:.*?\]/g,'').trim();
  if(isAr)return cleanText;
  let s=cleanText;
  s=s.replace(/🔥\s*تسخين وإطالات:/g,'🔥 Warm-up & Mobility:')
     .replace(/🏋️‍♀️\s*تمرين الجيم \(بالأجهزة\):/g,'🏋️‍♀️ Gym Exercise:')
     .replace(/🏠\s*بديل بالمنزل \(بدون أجهزة\):/g,'🏠 Home Exercise:')
     .replace(/🌸\s*\[بديل الهدوء[^\]]*\]/g,'🌸 [Gentle Cycle Alternative]')
     .replace(/🌸\s*\[تسخين لطيف[^\]]*\]/g,'🌸 [Gentle Cycle Warm-up]')
     .replace(/🌸\s*\[مُعدّل لنظام الهدوء[^\]]*\]/g,'🌸 [Gentle Mode - 50% Load]')
     .replace(/دقيقة/g, 'min')
     .replace(/دقيقه/g, 'min')
     .replace(/ثانية/g, 'sec')
     .replace(/ثواني/g, 'sec');
  if(s.includes(' - ')){

    const parts=s.split(' - ');
    const left=parts[0].trim();
    const right=parts.slice(1).join(' - ').trim();
    const setsMatch=right.match(/\([^)]*\)\s*$/);
    const sets=setsMatch?' '+setsMatch[0]:'';
    return`${left}${sets}`;
  }
  return s;
};

const extractDietMealParts=(text,isAr=true)=>{
  if(!text)return{badgeLabel:'',badgeIcon:'🍽️',badgeColor:'bg-brand text-white',foodBody:''};
  let clean=stripDietCalorieTags(text).replace(/^[•\-]\s*/,'').trim();
  const foodEmojis=clean.match(/[🥒🥣🧀🫘🍳🍗🐟🥫🥩🍢🥛🥗🥚🍏🍓🍿🍫🥜🍌🍠🥤🌴🍕🍔🍰]/gu)||[];
  clean=clean.replace(/[🥒🥣🧀🫘🍳🍗🐟🥫🥩🍢🥛🥗🥚🍏🍓🍿🍫🥜🍌🍠🥤🌴🍕🍔🍰]/gu,'').replace(/\s+/g,' ').trim();
  let mealType='meal';
  if(/^(?:إفطار|فطار|Breakfast)\s*:/i.test(clean)){mealType='brk';clean=clean.replace(/^(?:إفطار|فطار|Breakfast)\s*:\s*/i,'');}
  else if(/^(?:غداء|Lunch)\s*:/i.test(clean)){mealType='lun';clean=clean.replace(/^(?:غداء|Lunch)\s*:\s*/i,'');}
  else if(/^(?:عشاء|Dinner)\s*:/i.test(clean)){mealType='din';clean=clean.replace(/^(?:عشاء|Dinner)\s*:\s*/i,'');}
  else if(/^(?:سناك|Snack)\s*:/i.test(clean)){mealType='snk';clean=clean.replace(/^(?:سناك|Snack)\s*:\s*/i,'');}
  if(!isAr)clean=translateDietArToEn(clean);
  const leadEmoji=foodEmojis[0]||(mealType==='brk'?'🍳':mealType==='lun'?'🍗':mealType==='din'?'🥛':'🍿');
  const map={
    brk:{ar:'🌅 الفطار',en:'🌅 Breakfast',cls:'bg-pink-500 text-white'},
    lun:{ar:'☀️ الغداء',en:'☀️ Lunch',cls:'bg-sky-600 text-white'},
    din:{ar:'🌙 العشاء',en:'🌙 Dinner',cls:'bg-indigo-600 text-white'},
    snk:{ar:'🍿 سناك',en:'🍿 Snack',cls:'bg-amber-500 text-white'},
    meal:{ar:'🍽️ وجبة',en:'🍽️ Meal',cls:'bg-brand text-white'}
  };
  const m=map[mealType]||map.meal;
  return{badgeLabel:isAr?m.ar:m.en,badgeColor:m.cls,foodBody:`${leadEmoji} ${clean}`};
};

const addEmojisToDiet=(text,isAr=true)=>{
  const parts=extractDietMealParts(text,isAr);
  return parts.foodBody;
};

// قارئ الـ InBody الذكي الحقيقي بدون تخمين عشوائي (يترك غير الواضح فارغاً '')
const parseInbodyOCRText=(rawText)=>{
  const emptyRes={date:new Date().toISOString().split('T')[0],w:'',smm:'',bfm:'',pbf:'',bmr:'',vfl:'',ocrRead:true};
  if(!rawText||!rawText.trim())return emptyRes;
  const clean=rawText.replace(/,/g,'.').replace(/[|I]/g,'1');
  const lines=clean.split('\n').map(l=>l.trim()).filter(Boolean);
  const scaleNums=new Set([55,70,80,85,90,100,110,115,120,130,140,145,150,160,170,175,190,200,205,220,280,340,400,460,520,8,13,18,23,28,33,38,43,48,53,58,10,15]);
  const getDec=(str,min,max,ignoreScale=true)=>{
    const m=str.match(/\d{1,4}\.\d{1,2}/g)||[];
    for(const x of m){
      const v=parseFloat(x);
      if(ignoreScale&&scaleNums.has(v)&&x.endsWith('.0'))continue;
      if(v>=min&&v<=max)return v;
    }
    return null;
  };
  const getInt=(str,min,max)=>{
    const m=str.match(/\b\d{1,4}\b/g)||[];
    for(const x of m){
      const v=parseInt(x,10);
      if(v>=min&&v<=max)return v;
    }
    return null;
  };
  let w=null,smm=null,bfm=null,pbf=null,bmr=null,vfl=null,tbw=null,prot=null,minr=null;
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const nextLine=lines[i+1]||'';
    const next2Line=lines[i+2]||'';
    const windowStr=`${line} ${nextLine} ${next2Line}`;
    const stripRange=line.replace(/\(.*?\)/g,'');
    if(/Total Body Water|Body Water/i.test(line)&&!tbw)tbw=getDec(stripRange,18,65,false);
    if(/\bProtein\b/i.test(line)&&!prot)prot=getDec(stripRange,4,22,false);
    if(/\bMinerals\b/i.test(line)&&!minr)minr=getDec(stripRange,1.5,8,false);
    if(/Body Fat Mass|\bBFM\b/i.test(line)&&!bfm){
      bfm=getDec(stripRange,5,95,true)||getDec(nextLine,5,95,true);
    }
    if((/Sum of the above/i.test(line)||(/Weight/i.test(line)&&!/Target|Control/i.test(line)))&&!w){
      w=getDec(stripRange,35,180,true)||getDec(nextLine,35,180,true);
    }
    if(/\bSMM\b|Skeletal Muscle/i.test(line)&&!smm){
      const cleanWin=windowStr.replace(/70\s+80\s+90[\d\s.%]+/g,' ');
      smm=getDec(cleanWin,12,55,true);
    }
    if(/\bPBF\b|Percent Body Fat/i.test(line)&&!pbf){
      const cleanWin=windowStr.replace(/8\.0\s+13\.0[\d\s.%]+/g,' ');
      pbf=getDec(cleanWin,10,65,true);
    }
    if(/Basal Metabolic|\bBMR\b/i.test(line)&&!bmr){
      const bMatch=windowStr.match(/\b(1[0-9]\d{2}|2[0-5]\d{2})\b/);
      if(bMatch)bmr=parseInt(bMatch[1],10);
    }
    if(/Visceral Fat|\bVFL\b/i.test(line)&&!vfl){
      const cleanV=line.replace(/1\s*[-~]\s*9/g,'').replace(/\(.*?\)/g,'');
      vfl=getInt(cleanV,1,25)||getInt(nextLine.replace(/\(.*?\)/g,''),1,25);
    }
  }
  const bmrRegex=clean.match(/\b(1[0-9]\d{2}|2[0-5]\d{2})\s*kcal/i);
  if(!bmr&&bmrRegex)bmr=parseInt(bmrRegex[1],10);
  if(tbw&&prot&&minr&&bfm){
    const sumW=Number((tbw+prot+minr+bfm).toFixed(1));
    if(sumW>=35&&sumW<=180)w=sumW;
  }
  const targetMatch=clean.match(/Target Weight[^\d]*(\d{2,3}\.\d)/i);
  const ctrlMatch=clean.match(/Weight Control[^\d-]*([+-]?\s*\d{1,2}\.\d)/i);
  if(!w&&targetMatch&&ctrlMatch){
    const tw=parseFloat(targetMatch[1]);
    const cw=parseFloat(ctrlMatch[1].replace(/\s+/g,''));
    const calcW=Number((tw-cw).toFixed(1));
    if(calcW>=35&&calcW<=180)w=calcW;
  }
  if(!w||!smm||!pbf){
    const histW=clean.match(/Weight\s*\(?kg\)?[\s\S]{1,120}?((?:\d{2,3}\.\d\s*){2,8})/i);
    if(!w&&histW){const arr=histW[1].trim().split(/\s+/);w=parseFloat(arr[arr.length-1]);}
    const histS=clean.match(/SMM\s*\(?kg\)?[\s\S]{1,120}?((?:\d{2}\.\d\s*){2,8})/i);
    if(!smm&&histS){const arr=histS[1].trim().split(/\s+/);smm=parseFloat(arr[arr.length-1]);}
    const histP=clean.match(/PBF\s*\(?%\)?[\s\S]{1,120}?((?:\d{2}\.\d\s*){2,8})/i);
    if(!pbf&&histP){const arr=histP[1].trim().split(/\s+/);pbf=parseFloat(arr[arr.length-1]);}
  }
  if(w&&bfm&&!pbf)pbf=Number(((bfm/w)*100).toFixed(1));
  if(w&&pbf&&!bfm)bfm=Number((w*(pbf/100)).toFixed(1));
  return{
    date:new Date().toISOString().split('T')[0],
    w:w!==null&&!isNaN(w)?Number(w):'',
    smm:smm!==null&&!isNaN(smm)?Number(smm):'',
    bfm:bfm!==null&&!isNaN(bfm)?Number(bfm):'',
    pbf:pbf!==null&&!isNaN(pbf)?Number(pbf):'',
    bmr:bmr!==null&&!isNaN(bmr)?Number(bmr):'',
    vfl:vfl!==null&&!isNaN(vfl)?Number(vfl):'',
    ocrRead:true
  };
};

const calcAge=(dob)=>{if(!dob)return 25;const parts=dob.split('-').map(Number);if(parts.length!==3)return 25;const today=new Date();let age=today.getFullYear()-parts[0];const m=today.getMonth()+1-parts[1];if(m<0||(m===0&&today.getDate()<parts[2]))age--;return Math.max(10,age);};
const isBirthdayToday=(dob)=>{if(!dob)return false;const parts=dob.split('-').map(Number);if(parts.length!==3)return false;const today=new Date();return(today.getMonth()+1)===parts[1]&&today.getDate()===parts[2];};
const safeSch=(arr)=>(Array.isArray(arr)&&arr.length===7)?arr.map(x=>x&&typeof x==='object'?x:{}):[{},{},{},{},{},{},{}];
const calcSleep=(wake,sleep)=>{if(!wake||!sleep)return{h:8,m:0};const w=wake.split(':').map(Number);const s=sleep.split(':').map(Number);let wMins=w[0]*60+(w[1]||0);let sMins=s[0]*60+(s[1]||0);if(wMins<=sMins)wMins+=24*60;const diff=wMins-sMins;return{h:Math.floor(diff/60),m:diff%60};};
const getMacs=(u,isAr=true)=>{
  let a=calcAge(u.dob);
  let h=Number(u.h)||160;
  let iW=Number(u.iW)||(h>105?h-105:60);

  const hist=Array.isArray(u.inbodyHistory)&&u.inbodyHistory.length>0?u.inbodyHistory:null;
  const latestInb=hist?hist[hist.length-1]:null;
  let w=(latestInb&&Number(latestInb.w)>=30)?Number(latestInb.w):(Number(u.w)||65);
  let bmi=w/((h/100)*(h/100));

  const inbSMM=latestInb&&Number(latestInb.smm)>=8?Number(latestInb.smm):null;
  const inbBFM=latestInb&&Number(latestInb.bfm)>=3?Number(latestInb.bfm):null;
  const inbPBF=latestInb&&Number(latestInb.pbf)>=5?Number(latestInb.pbf):(inbBFM?Number(((inbBFM/w)*100).toFixed(1)):null);
  const inbBMR=latestInb&&Number(latestInb.bmr)>=800?Number(latestInb.bmr):null;

  let pbf=inbPBF!==null?inbPBF:Math.max(12,Math.min(55,(1.20*bmi)+(0.23*a)-5.4));
  let lbm=w*(1-(pbf/100));

  let bmrCurr=0; let src='';
  if(inbBMR){bmrCurr=inbBMR;src=isAr?'مربوط بـ InBody + الهدف 🟢':'InBody + Target Synced 🟢';}
  else if(inbPBF!==null||inbSMM!==null){bmrCurr=370+(21.6*lbm);src=isAr?'معادلة InBody والهدف 🔵':'InBody & Target Math 🔵';}
  else{bmrCurr=(10*w)+(6.25*h)-(5*a)-161;src=isAr?'معادلة الهدف القياسية ⚪':'Target Standard Math ⚪';}

  // ربط مباشر بالوزن المثالي (iW) بحيث يتغير كل شيء فوراً عند تعديله
  let bmrIdeal=(10*iW)+(6.25*h)-(5*a)-161;
  if(inbPBF!==null){
    let idealLBM=iW*0.78;
    bmrIdeal=370+(21.6*idealLBM);

const unsub=db.collection('elite_clients').onSnapshot(s=>{
  const allDocs=s.docs.map(d=>({id:d.id,...d.data()}));

  localStorage.setItem('gg_local_clients_db',JSON.stringify(fbClients));
  setClients(fbClients);
  setEditingClient(prev=>{
    if(!prev)return null;
    const match=fbClients.find(c=>c.ph===prev.ph||c.id===prev.id||(prev._origPh&&c.ph===prev._origPh));
    return match?{...match,_origPh:match.ph}:prev;
  });

// رفع وقراءة صورة الـ InBody بالـ OCR الذكي (بدون أرقام عشوائية)
const handleFileUp=async(e,targetClient,cb)=>{
  const file=e.target.files?.[0];
  if(!file)return;
  setUploadingInb(true);
  try{
    const dataUrl=await compressToDataUrl(file,false);
    const ocrImgUrl=await compressToDataUrl(file,true);
    let extracted={date:new Date().toISOString().split('T')[0],w:'',smm:'',bfm:'',pbf:'',bmr:'',vfl:''};
    if(window.Tesseract){
      try{
        const res=await window.Tesseract.recognize(ocrImgUrl,'eng');
        extracted=parseInbodyOCRText(res?.data?.text||'');
      }catch(ocrErr){
        console.warn('OCR warning:',ocrErr);
      }
    }
    const newEntry={...extracted,img:dataUrl,id:Date.now()};
    cb(dataUrl,newEntry);
    setInbDraft({
      w:extracted.w!==''?extracted.w:'',
      smm:extracted.smm!==''?extracted.smm:'',
      bfm:extracted.bfm!==''?extracted.bfm:'',
      pbf:extracted.pbf!==''?extracted.pbf:'',
      bmr:extracted.bmr!==''?extracted.bmr:'',
      vfl:extracted.vfl!==''?extracted.vfl:''
    });
    setInbFormModal(true);
  }catch(err){
    alert(isAr?'حدث خطأ أثناء رفع الصورة':'Error uploading image');
  }finally{
    setUploadingInb(false);
    e.target.value='';
  }
};

const updateDB=(c,oldPh=null)=>{
  if(!c||!c.ph)return;
  const cleanPh=String(c.ph).trim();
  const cleanOld=oldPh?String(oldPh).trim():null;
  const docData={...c,ph:cleanPh,id:cleanPh};
  if(cleanOld&&cleanOld!==cleanPh){
    db.collection('elite_clients').doc(cleanOld).delete().catch(()=>{});
    let localDB=JSON.parse(localStorage.getItem('gg_local_clients_db')||'[]').filter(x=>x.ph!==cleanOld&&x.id!==cleanOld);
    localDB.push(docData);
    localStorage.setItem('gg_local_clients_db',JSON.stringify(localDB));
    setClients(localDB);
    if(currentUser&&(currentUser.ph===cleanOld||currentUser.id===cleanOld)){
      setCurrentUser(docData);
      sessionStorage.setItem('elite_phone',cleanPh);
    }
    db.collection('elite_clients').doc(cleanPh).set(docData).catch(()=>{});
    return;
  }
  let localDB=JSON.parse(localStorage.getItem('gg_local_clients_db')||'[]');
  const idx=localDB.findIndex(x=>x.ph===cleanPh||x.id===cleanPh);
  if(idx>-1)localDB[idx]=docData;else localDB.push(docData);
  localStorage.setItem('gg_local_clients_db',JSON.stringify(localDB));
  setClients(localDB);
  if(currentUser&&(currentUser.ph===cleanPh||currentUser.id===cleanPh))setCurrentUser(docData);
  db.collection('elite_clients').doc(cleanPh).set(docData,{merge:true}).catch(()=>{});
};

const drawMealIllustration=(ctx,x,y,size,mealText)=>{
  ctx.save();
  ctx.filter='none';
  ctx.globalAlpha=1.0;

  // خلفية الكارت الخارجي للطبق (أبيض كريمي منور بدون أي تغميق)
  const bgGrad=ctx.createLinearGradient(x,y,x+size,y+size);
  bgGrad.addColorStop(0,'#ffffff');
  bgGrad.addColorStop(1,'#fce7f3');
  ctx.fillStyle=bgGrad;
  ctx.beginPath();
  ctx.roundRect(x,y,size,size,18);
  ctx.fill();

  // إطار خارجي وردي/ذهبي واضح
  ctx.strokeStyle='#ff007f';
  ctx.lineWidth=2;
  ctx.stroke();

  // حافة الطبق الدائري البورسلين بالداخل
  const cx=x+size/2, cy=y+size/2, r=size*0.41;
  ctx.fillStyle='#f8fafc';
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#cbd5e1';
  ctx.lineWidth=1.5;
  ctx.stroke();

  // استخراج مكونات الوجبة لرسمها بوضوح تام وألوان صريحة
  const icons=[];
  if(/بيض|أومليت|egg|omelet/i.test(mealText))icons.push('🍳');
  if(/فول|عدس|حمص|fava|beans/i.test(mealText))icons.push('🫘');
  if(/جبن|قريش|cheese/i.test(mealText))icons.push('🧀');
  if(/دجاج|فرخ|شيش|ترك|رومي|chicken|turkey/i.test(mealText))icons.push('🍗');
  if(/سمك|بلطي|سلمون|فيليه|fish|salmon/i.test(mealText))icons.push('🐟');
  if(/تونة|tuna/i.test(mealText))icons.push('🥫');
  if(/لحم|كفتة|ستيك|كبدة|beef|meat/i.test(mealText))icons.push('🥩');
  if(/أرز|فريك|برغل|كشري|rice/i.test(mealText))icons.push('🍚');
  if(/مكرونة|pasta/i.test(mealText))icons.push('🍝');
  if(/رغيف|عيش|توست|خبز|bread|toast/i.test(mealText))icons.push('🥖');
  if(/بطاطس|بطاطا|potato/i.test(mealText))icons.push('🍠');
  if(/شوفان|شيا|oats/i.test(mealText))icons.push('🥣');
  if(/أفوكادو|avocado/i.test(mealText))icons.push('🥑');
  if(/زبادي|حليب|لبن|yogurt|milk/i.test(mealText))icons.push('🥛');
  if(/سلطة|خيار|خس|جرجير|خضار|salad/i.test(mealText))icons.push('🥗');
  if(/تفاح|برتقال|فراولة|موز|فواكه|تمر|apple|banana/i.test(mealText))icons.push('🍓');
  if(/لوز|مكسرات|فول سوداني|عين جمل|nuts/i.test(mealText))icons.push('🥜');
  if(/فشار|popcorn/i.test(mealText))icons.push('🍿');
  if(/شوكولاتة|choc/i.test(mealText))icons.push('🍫');
  if(icons.length===0)icons.push('🍽️','🥗');

  const topIcons=icons.slice(0,4);
  ctx.fillStyle='#000000';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.12)';
  ctx.shadowBlur=3;

  if(topIcons.length===1){
    ctx.font='34px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText(topIcons[0],cx,cy+1);
  }else if(topIcons.length===2){
    ctx.font='25px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText(topIcons[0],cx-13,cy-7);
    ctx.fillText(topIcons[1],cx+13,cy+9);
  }else if(topIcons.length===3){
    ctx.font='22px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText(topIcons[0],cx,cy-13);
    ctx.fillText(topIcons[1],cx-14,cy+11);
    ctx.fillText(topIcons[2],cx+14,cy+11);
  }else{
    ctx.font='20px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText(topIcons[0],cx-13,cy-12);
    ctx.fillText(topIcons[1],cx+13,cy-12);
    ctx.fillText(topIcons[2],cx-13,cy+13);
    ctx.fillText(topIcons[3],cx+13,cy+13);
  }
  ctx.restore();
};

const wrapCanvasLines=(ctx,text,maxWidth)=>{
  const words=String(text||'').split(' ');
  const lines=[];
  let cur='';
  for(let w of words){
    const test=cur?`${cur} ${w}`:w;
    if(ctx.measureText(test).width>maxWidth&&cur){
      lines.push(cur);
      cur=w;
    }else{
      cur=test;
    }
  }
  if(cur)lines.push(cur);
  return lines;
};

const exportWeeklyDietPoster=async()=>{
  if(!editingClient)return;
  setGeneratingPoster(true);
  setTimeout(()=>{
    try{
      const cData=getMacs(editingClient,isAr);
      const sch=safeSch(editingClient.sch);
      const dayNames=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
      const W=1160;

      // تجهيز بيانات الأيام الـ 7
      const parsedDays=DAYS_ORDER.map(dIdx=>{
        const dObj=sch[dIdx]||{};
        const rawLines=String(dObj.diet||'').split('\n').map(l=>l.trim()).filter(Boolean);
        let focusLine='';
        let totalLine='';
        const meals=[];
        rawLines.forEach(l=>{
          if(l.includes('🎯'))focusLine=l.replace('🎯','').trim();
          else if(l.includes('📊'))totalLine=l.replace('📊','').trim();
          else meals.push(l.replace(/^[•\-]\s*/,''));
        });
        const spName=(dObj?.customSplit&&dObj.customSplit.trim())?dObj.customSplit.trim():(SPLIT_PARTS.find(p=>p.id===(dObj?.split||'full'))?.n||'تمرين');
        if(!focusLine||focusLine.includes('شامل لكل الجسم')){
          focusLine=dObj?.freeDay
            ?'🍕 يوم فري مفتوح (استمتعي بوجبتك المفضلة)'
            :(dObj?.active
              ?`⚡ يوم تمرين (${spName}): السناك قبل التمرين بـ 45 دقيقة للطاقة، والغداء بعد التمرين للاستشفاء`
              :`🌿 يوم راحة واستشفاء: شرب ${editingClient.water||sysConf.water||3} لتر مياه وتقليل النشويات ليلاً`);
        }
        if(meals.length===0&&dObj?.freeDay){
          meals.push('إفطار: وجبة مفتوحة (يوم فري 🎉)','غداء: وجبة فري مفتوحة من اختيارك 🍕','عشاء: زبادي لايت بالليمون 🥛');
        }
        return{dayName:dayNames[dIdx],freeDay:!!dObj.freeDay,active:!!dObj.active,focusLine,totalLine,meals};
      });

      let totalH=340;
      parsedDays.forEach(pd=>{
        const mealRows=Math.max(1,pd.meals.length);
        totalH+=98+(mealRows*102)+24;
      });
      totalH+=215; // مساحة كارت المياه والفيتامينات المتبروز + الفوتر

      const canvas=document.createElement('canvas');
      canvas.width=W;
      canvas.height=totalH;
      const ctx=canvas.getContext('2d');
      ctx.direction='rtl';

      // الخلفية الأساسية
      const bgGrad=ctx.createLinearGradient(0,0,W,totalH);
      bgGrad.addColorStop(0,'#090d16');
      bgGrad.addColorStop(0.5,'#150d26');
      bgGrad.addColorStop(1,'#090d16');
      ctx.fillStyle=bgGrad;
      ctx.fillRect(0,0,W,totalH);

      // الإطار العام
      ctx.strokeStyle='#ff007f';
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.roundRect(14,14,W-28,totalH-28,32);
      ctx.stroke();

      // الهيدر العلوي
      const hdrGrad=ctx.createLinearGradient(36,36,W-36,175);
      hdrGrad.addColorStop(0,'#ff007f');
      hdrGrad.addColorStop(1,'#00b4d8');
      ctx.fillStyle=hdrGrad;

      ctx.roundRect(36,36,W-72,135,26);

      ctx.fillStyle='#ffffff';
      ctx.font='900 32px Cairo, sans-serif';
      ctx.fillText(`👑 خطة التغذية الأسبوعية | ${editingClient.n}`,W-65,88);

      ctx.roundRect(36,188,W-72,115,22);

const genSmartDietOnly=()=>{

  const hasFishAlg=/سمك|تونة|جمبري|بحر|fish|tuna/i.test(algStr);

  const hasNutsAlg=/مكسرات|لوز|فول سوداني|nuts/i.test(algStr);

  const filterPool=(arr)=>arr.filter(item=>{
    if(hasFishAlg&&/fish|tuna|tilapia|salmon/i.test(item.id))return false;
    if(hasDairyAlg&&/koraish|greek|yogurt|cottage|milk/i.test(item.id))return false;

  });

  const brkFatPool=filterPool(EGY_INGREDIENTS.brk_fat);
  const lunProPool=filterPool(EGY_INGREDIENTS.lun_pro);
  const lunCarbPool=filterPool(EGY_INGREDIENTS.lun_carb);

    const bp=brkProPool[dStep%brkProPool.length]||EGY_INGREDIENTS.brk_pro[0];
    const bc=brkCarbPool[(dStep*2)%brkCarbPool.length]||EGY_INGREDIENTS.brk_carb[0];

    const brkProMult=Math.max(0.7,Math.min(1.6,(targetPro*0.26)/(bp.p+bc.p)));
    const brkCarbMult=Math.max(0.6,Math.min(1.8,((targetCarb*0.30)-(bp.cr*brkProMult))/Math.max(10,bc.cr)));
    const brkFatMult=Math.max(0.6,Math.min(1.5,(targetFat*0.28)/Math.max(5,bf.f)));

    const brkCal=Math.round((bp.c*brkProMult)+(bc.c*brkCarbMult)+(bf.c*brkFatMult));
    const brkProG=Math.round((bp.p*brkProMult)+(bc.p*brkCarbMult)+(bf.p*brkFatMult));
    const brkCarbG=Math.round((bp.cr*brkProMult)+(bc.cr*brkCarbMult)+(bf.cr*brkFatMult));
    const brkFatG=Math.round((bp.f*brkProMult)+(bc.f*brkCarbMult)+(bf.f*brkFatMult));
        const brkLine=`${bp.fmt(brkProMult)} + ${bc.fmt(brkCarbMult)} + ${bf.fmt(brkFatMult)} [🔥 ${brkCal} Cal | 🥩 ${brkProG}g Pro | 🍞 ${brkCarbG}g Carb | 🧈 ${brkFatG}g Fat]`;

    // 2. تركيب وجبة الغداء (حوالي 42% من احتياج اليوم)
    const lp=lunProPool[(dStep+1)%lunProPool.length]||EGY_INGREDIENTS.lun_pro[0];
    const lc=lunCarbPool[(dStep*2+1)%lunCarbPool.length]||EGY_INGREDIENTS.lun_carb[0];

    const lunProMult=Math.max(0.75,Math.min(1.75,(targetPro*0.44)/Math.max(25,lp.p)));

    const saladCal=45;

    const lunProG=Math.round((lp.p*lunProMult)+(lc.p*lunCarbMult)+1);
    const lunCarbG=Math.round((lp.cr*lunProMult)+(lc.cr*lunCarbMult)+6);

    const lunLine=`${lp.fmt(lunProMult)} + ${lc.fmt(lunCarbMult)} + طبق سلطة خضراء كبير بالليمون والجرجير 🥗 [🔥 ${lunCal} Cal | 🥩 ${lunProG}g Pro | 🍞 ${lunCarbG}g Carb | 🧈 ${lunFatG}g Fat]`;

    // 3. تركيب السناك (حوالي 13% من احتياج اليوم)

    const snkCarbG=Math.round(sn.cr*snkMult);

    // 4. تركيب وجبة العشاء لضبط باقي سعرات وماكروز اليوم بدقة

    const dinCal=Math.round(dm.c*dinMult);
    const dinProG=Math.round(dm.p*dinMult);
    const dinCarbG=Math.round(dm.cr*dinMult);
    const dinFatG=Math.round(dm.f*dinMult);
    const dinLine=`${dm.fmt(dinMult)} [🔥 ${dinCal} Cal | 🥩 ${dinProG}g Pro | 🍞 ${dinCarbG}g Carb | 🧈 ${dinFatG}g Fat]`;

    const totalDayCal=brkCal+lunCal+dinCal+snkCal;
    const totalDayPro=brkProG+lunProG+dinProG+snkProG;
    const totalDayCarb=brkCarbG+lunCarbG+dinCarbG+snkCarbG;
    const totalDayFat=brkFatG+lunFatG+dinFatG+snkFatG;

    const workoutSyncTag=isWorkDay
      ?`⚡ [يوم تمرين (${spName}): السناك قبل التمرين بـ 45 دقيقة، والغداء بعد التمرين]`
      :`🌿 [يوم راحة واستشفاء: شرب ${editingClient.water||sysConf.water||3} لتر مياه وتقليل النشويات ليلاً]`;

        return{
      ...day,

      snacks:snkLine
    };
  });

  setEditingClient(p=>({...p,sch:s}));
  alert(isAr

    :`Smart Egyptian Diet Plan generated for ${targetCal} Cal (${targetPro}g Pro | ${targetCarb}g Carb | ${targetFat}g Fat)! 🥗`
  );
};

const playMoodShuffle=(moodObj,forceNext=false)=>{
  if(!moodObj)return;
  if(actMoodId===moodObj.id&&!forceNext){
    audioRef.current.pause();
    setActMoodId(null);
    setActMusic(null);
    setActTrackName('');
    return;
  }
  const pool=moodObj.tracks||[];
  if(pool.length===0)return;
  const others=pool.filter(t=>t.name!==actTrackName);
  const pick=(others.length>0?others:pool)[Math.floor(Math.random()*(others.length>0?others.length:pool.length))];
  setActMoodId(moodObj.id);
  setActTrackName(pick.name);
  setActMusic(pick.url);
  audioRef.current.src=pick.url;
  audioRef.current.onerror=()=>{
    if(pick.fallback&&audioRef.current.src!==pick.fallback){
      audioRef.current.src=pick.fallback;
      audioRef.current.play().catch(()=>{});
    }
  };
  audioRef.current.onended=()=>{
    playMoodShuffle(moodObj,true);
  };
  audioRef.current.play().catch(()=>{
    if(pick.fallback){
      audioRef.current.src=pick.fallback;
      audioRef.current.play().catch(()=>{});
    }
  });
};

const splitCombinedLine=(line)=>{if(!line)return[];if(line.includes('🎯')||line.includes('📊')||line.includes('🩺')||line.includes('إفطار')||line.includes('غداء')||line.includes('عشاء')||line.includes('سناك'))return[line];const leadMatch=line.match(/^(🔥\s*تسخين وإطالات:|🏋️‍♀️\s*تمرين الجيم \(بالأجهزة\):|🏠\s*بديل بالمنزل \(بدون أجهزة\):)/u);const prefix=leadMatch?leadMatch[1]+' ':'';const body=leadMatch?line.slice(leadMatch[0].length).trim():line.trim();const dashParts=body.split(' - ');if(dashParts.length>=2){const engPart=dashParts[0].trim();const arPart=dashParts.slice(1).join(' - ').trim();if(/\s+(?:&|\/|Superset|to)\s+/i.test(engPart)){const engSplit=engPart.split(/\s+(?:&|\/|Superset|to)\s+/i).map(s=>s.trim()).filter(Boolean);if(engSplit.length===2){const setsMatch=arPart.match(/\([^)]+\)$/);const setsStr=setsMatch?' '+setsMatch[0]:' (3x12)';const arClean=arPart.replace(/\([^)]+\)$/,'').trim();const arSplit=arClean.split(/\s+(?:\+|و|أو)\s+/);if(arSplit.length>=2){return[`${prefix}${engSplit[0]} - ${arSplit[0].trim()}${setsStr}`,`${prefix}${engSplit[1]} - ${arSplit.slice(1).join(' ').trim()}${setsStr}`];}return[`${prefix}${engSplit[0]} - ${arClean}${setsStr}`,`${prefix}${engSplit[1]} - ${arClean}${setsStr}`];}}}return[line];};

        <input type="number" step="0.1" autoFocus className="w-full p-3.5 rounded-xl border bg-input font-black text-center text-3xl mb-4 outline-none" value={newW} onChange={e=>setNewW(e.target.value)} placeholder="0.0"/>
        <button onClick={()=>{if(!newW)return alert(txt.errReq);const nU={...currentUser,w:Number(newW)};updateDB(nU);setShowUpdateModal(false);if(Math.abs(Number(newW)-iW)<=2)alert(isAr?'عاش يا بطلة! قربنا جداً للوزن المثالي 🎉':'Great job! So close to your goal 🎉');}} className="w-full bg-brand text-white py-3.5 rounded-xl font-black text-sm shadow-md cursor-pointer">{isAr?'حفظ الوزن الجديد ✔️':'Save New Weight ✔️'}</button>
      </div>
    </div>
  )}

  <div className="fixed bottom-0 left-0 w-full bg-white dark:bg-slate-900 border-t border-gray-100 dark:border-slate-800 shadow-[0_-5px_20px_rgba(0,0,0,0.06)] flex justify-around p-2 z-40">
    <button onClick={()=>changeClientTab('home')} className={`nav-btn ${clientTab==='home'?'active':''}`}><span className="icon">🏠</span><span>{txt.tHm}</span></button>
    <button onClick={()=>changeClientTab('workout')} className={`nav-btn ${clientTab==='workout'?'active':''}`}><span className="icon">💪</span><span>{txt.tEx}</span></button>
    <button onClick={()=>changeClientTab('diet')} className={`nav-btn ${clientTab==='diet'?'active':''}`}><span className="icon">🥗</span><span>{txt.tDt}</span></button>
    <button onClick={()=>changeClientTab('settings')} className={`nav-btn ${clientTab==='settings'?'active':''}`}><span className="icon">⚙️</span><span>{txt.tSet}</span></button>
  </div>
</div>);}
return null;};
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
  </html>
