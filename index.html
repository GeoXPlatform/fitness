const formatTime12h = (time24) => {
    if(!time24) return '';
    let [h, m] = time24.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; h = h ? h : 12;
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')} ${ampm}`;
};
const formatTime12hAr = (time24) => {
    if(!time24) return '';
    let [h, m] = time24.split(':').map(Number);
    const ampm = h >= 12 ? 'م' : 'ص';
    h = h % 12; h = h ? h : 12;
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')} ${ampm}`;
};

const formatCoachHours = (str, isAr) => {
    if(!str || str === 'إجازة' || !str.includes(' - ')) return str || (isAr?'إجازة':'Off');
    const [from, to] = str.split(' - ');
    return `${isAr ? formatTime12hAr(from) : formatTime12h(from)} - ${isAr ? formatTime12hAr(to) : formatTime12h(to)}`;
};

const addEmojisToDiet = (text) => { if (!text) return text; return text.replace(/بيض/g, '🍳 بيض').replace(/فراخ|دجاج/g, '🍗 فراخ').replace(/سمك|تونة/g, '🐟 سمك').replace(/لحم/g, '🥩 لحم').replace(/شوفان/g, '🥣 شوفان').replace(/رز|أرز/g, '🍚 رز').replace(/مكرونة/g, '🍝 مكرونة').replace(/خضار|سلطة/g, '🥗 سلطة').replace(/فاكهة|تفاح|موز/g, '🍎 فاكهة').replace(/زبادي/g, '🥛 زبادي').replace(/عيش|توست/g, '🍞 عيش').replace(/جبن/g, '🧀 جبن'); };
const calcAge = (dob) => { if(!dob) return 25; const diff = Date.now() - new Date(dob).getTime(); return Math.abs(new Date(diff).getUTCFullYear() - 1970); };
const calcInBodyData = (w, h, dob, g, l) => { let a = calcAge(dob); let bmi = w / ((h/100)*(h/100)); let pbf = (1.20 * bmi) + (0.23 * a) - 5.4; let bmr = (10*w) + (6.25*h) - (5*a) - 161; let act = l.includes('مبتدئ')||l.includes('Beg')?1.3:l.includes('متوسط')||l.includes('Int')?1.55:1.75; let tdee = bmr * act; let state = bmi < 18.5 ? "نحافة" : bmi < 25 ? "وزن مثالي" : bmi < 30 ? "وزن زائد" : "سمنة"; let cal=tdee; if(g==='loss') cal=tdee-500; else if(g==='gain') cal=tdee+400; return {bmi:bmi.toFixed(1), pbf:pbf.toFixed(1), bmr:Math.round(bmr), tdee:Math.round(tdee), c:Math.round(cal), p:Math.round(w*(g==='loss'?2.2:g==='gain'?2.4:2)), cr:Math.round((cal*(g==='loss'?0.35:g==='gain'?0.5:0.4))/4), f:Math.round((cal*0.25)/9), state }; };

    if(!isOpen) return null;

                        <span className="text-2xl font-black">:</span>
                        <input type="number" placeholder="SS" className="w-16 p-3 text-center rounded-xl bg-input border font-bold text-lg outline-none" value={sec} onChange={e=>setSec(e.target.value)} />

const calcSleep = (tgtWake, tgtSleep, isArLocal) => { 
    if(!tgtWake || !tgtSleep) return {h:0, m:0, msg:isArLocal?'غير محدد':'Not Set'}; 
    const [wH, wM] = tgtWake.split(':').map(Number);
    const [sH, sM] = tgtSleep.split(':').map(Number);
    let diff = (wH*60 + wM) - (sH*60 + sM);
    if(diff < 0) diff += 24*60;
    const h = Math.floor(diff/60); const m = diff%60; 
    let msg = h>=7?(isArLocal?'ممتاز 😴':'Great 😴'):h>=5?(isArLocal?'مقبول 🥱':'Okay 🥱'):(isArLocal?'قليل جداً ⚠️':'Too Short ⚠️'); 
    return {h, m, msg}; 
};

const handleCheckIn = (type, tdStr, wakeTgt, isArLocal) => {
    const now = new Date(); const timeStr = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
    const log = currentUser.dailyLog?.[tdStr] || {};
    if(type==='wake'){ 
        const nowMins = now.getHours()*60 + now.getMinutes();
        const tgtMins = getMins(wakeTgt||'07:00');
        const diff = nowMins - tgtMins;
        let status = '';
        if(diff < -30) status = isArLocal?'بدري 🌟':'Early 🌟';
        else if(diff <= 30) status = isArLocal?'في الموعد 🎯':'On Time 🎯';
        else status = isArLocal?'متأخر ⏰':'Late ⏰';
        updateDB({...currentUser, dailyLog:{...currentUser.dailyLog, [tdStr]:{...log, wakeTime: isArLocal?formatTime12hAr(timeStr):formatTime12h(timeStr), wakeStatus: status}}});
    } else if(type==='gym'){ updateDB({...currentUser, dailyLog:{...currentUser.dailyLog, [tdStr]:{...log, gymTime: isArLocal?formatTime12hAr(timeStr):formatTime12h(timeStr)}}}); }

                            if(Math.abs(newW - iW) <= 2) alert(isAr?'عاش يا بطلة! قربنا جداً للهدف 🎉':'Great job! So close to your goal 🎉');
                        }} className="w-full bg-brand text-white py-4 rounded-xl font-black shadow-md">{isAr?'حفظ الوزن الجديد':'Save New Weight'}</button>
                    </div>
                </div>
            )}

            {/* Bottom Navigation Bar */}
            <div className="fixed bottom-0 left-0 w-full bg-white dark:bg-slate-900 border-t border-gray-100 dark:border-slate-800 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] flex justify-around p-2 z-40 pb-safe">
                <button onClick={()=>setClientTab('home')} className={`nav-btn ${clientTab==='home'?'active':''}`}><span className="icon">🏠</span><span>{txt.tHm}</span></button>
                <button onClick={()=>setClientTab('workout')} className={`nav-btn ${clientTab==='workout'?'active':''}`}><span className="icon">💪</span><span>{txt.tEx}</span></button>
                <button onClick={()=>setClientTab('diet')} className={`nav-btn ${clientTab==='diet'?'active':''}`}><span className="icon">🥗</span><span>{txt.tDt}</span></button>
                <button onClick={()=>setClientTab('settings')} className={`nav-btn ${clientTab==='settings'?'active':''}`}><span className="icon">⚙️</span><span>{txt.tSet}</span></button>
            </div>
            
        </div>
    );
}
return null;
};const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script></body></html>
