const formatTime12h = (time24) => {
    if(!time24) return '';
    let [h, m] = time24.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; h = h ? h : 12;
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')} ${ampm}`;
};

const addEmojisToDiet = (text) => { if (!text) return text; return text.replace(/بيض/g, '🍳 بيض').replace(/فراخ|دجاج/g, '🍗 فراخ').replace(/سمك|تونة/g, '🐟 سمك').replace(/لحم/g, '🥩 لحم').replace(/شوفان/g, '🥣 شوفان').replace(/رز|أرز/g, '🍚 رز').replace(/مكرونة/g, '🍝 مكرونة').replace(/خضار|سلطة/g, '🥗 سلطة').replace(/فاكهة|تفاح|موز/g, '🍎 فاكهة').replace(/زبادي/g, '🥛 زبادي').replace(/عيش|توست/g, '🍞 عيش').replace(/جبن/g, '🧀 جبن'); };
const calcAge = (dob) => { if(!dob) return 25; const diff = Date.now() - new Date(dob).getTime(); return Math.abs(new Date(diff).getUTCFullYear() - 1970); };
const calcInBodyData = (w, h, dob, g, l) => { let a = calcAge(dob); let bmi = w / ((h/100)*(h/100)); let pbf = (1.20 * bmi) + (0.23 * a) - 5.4; let bmr = (10*w) + (6.25*h) - (5*a) - 161; let act = l.includes('مبتدئ')||l.includes('Beg')?1.3:l.includes('متوسط')||l.includes('Int')?1.55:1.75; let tdee = bmr * act; let state = bmi < 18.5 ? "نحافة" : bmi < 25 ? "وزن مثالي" : bmi < 30 ? "وزن زائد" : "سمنة"; let cal=tdee; if(g==='loss') cal=tdee-500; else if(g==='gain') cal=tdee+400; return {bmi:bmi.toFixed(1), pbf:pbf.toFixed(1), bmr:Math.round(bmr), tdee:Math.round(tdee), c:Math.round(cal), p:Math.round(w*(g==='loss'?2.2:g==='gain'?2.4:2)), cr:Math.round((cal*(g==='loss'?0.35:g==='gain'?0.5:0.4))/4), f:Math.round((cal*0.25)/9), state }; };

                    <div className="flex gap-2 justify-center mb-6" dir="ltr">
                        <input type="number" placeholder="MM" className="w-16 p-3 text-center rounded-xl bg-input border font-bold text-lg" value={min} onChange={e=>setMin(e.target.value)} />
                        <span className="text-2xl font-black">:</span>
                        <input type="number" placeholder="SS" className="w-16 p-3 text-center rounded-xl bg-input border font-bold text-lg" value={sec} onChange={e=>setSec(e.target.value)} />
                    </div>
                )}

                <div className="flex justify-center gap-3 mb-6">
                    <button onClick={()=>{
                        if(!run && time===0 && (min||sec)){ const t=(Number(min||0)*60)+Number(sec||0); setTime(t); setRun(true); } 
                        else setRun(!run); 
                    }} disabled={time===0 && !min && !sec} className="bg-brand text-white px-8 py-3 rounded-xl font-black text-sm disabled:opacity-50">
                        {run ? (isAr?'إيقاف مؤقت':'Pause') : (time>0 ? (isAr?'استكمال':'Resume') : (isAr?'بدء':'Start'))}
                    </button>
                    {(time>0 || min || sec) && !run && (
                        <button onClick={()=>{setRun(false);setTime(0);setMin('');setSec('');}} className="bg-gray-200 dark:bg-slate-700 px-6 py-3 rounded-xl font-black text-sm text-gray-700 dark:text-gray-300">
                            {isAr?'إلغاء':'Reset'}
                        </button>
                    )}
                </div>

                {!run && time===0 && (
                    <div className="grid grid-cols-3 gap-2 border-t dark:border-slate-700 pt-4">
                        <button onClick={()=>{setTime(30);setRun(true);}} className="bg-brand/10 text-brand py-2 rounded-lg font-bold text-xs hover:bg-brand/20">30s {isAr?'راحة':'Rest'}</button>
                        <button onClick={()=>{setTime(60);setRun(true);}} className="bg-brand/10 text-brand py-2 rounded-lg font-bold text-xs hover:bg-brand/20">1m {isAr?'راحة':'Rest'}</button>
                        <button onClick={()=>{setTime(90);setRun(true);}} className="bg-brand/10 text-brand py-2 rounded-lg font-bold text-xs hover:bg-brand/20">1.5m {isAr?'راحة':'Rest'}</button>
                    </div>
                )}
            </div>
        </div>
    );
};

const StopwatchModal = ({isOpen, onClose, isAr}) => {
    const [time, setTime] = useState(0); const [run, setRun] = useState(false);
    useEffect(() => { let int; if(run) int = setInterval(()=>setTime(t=>t+1),1000); return ()=>clearInterval(int); }, [run]);
    if(!isOpen) return null;
    const format = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
    return (
        <div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center animate-zoom-in p-4" onClick={(e)=>{if(e.target===e.currentTarget)onClose();}}>
            <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] p-6 text-center relative border border-brand-dark/20 shadow-2xl">
                <button onClick={onClose} className="absolute top-4 right-4 bg-gray-100 dark:bg-slate-700 w-8 h-8 rounded-full font-bold">✕</button>
                <h3 className="font-black text-xl mb-6 text-brand-dark">⏱️ {isAr?'ساعة إيقاف':'Stopwatch'}</h3>
                
                <div className="watch-circle mb-8 border-brand-dark"><span className="font-black text-5xl font-english tracking-widest text-brand-dark">{format(time)}</span></div>

                <div className="flex justify-center gap-3">
                    <button onClick={()=>setRun(!run)} className="bg-brand-dark text-white px-8 py-3 rounded-xl font-black text-sm">
                        {run ? (isAr?'إيقاف مؤقت':'Pause') : (time>0?(isAr?'استكمال':'Resume'):(isAr?'بدء':'Start'))}
                    </button>
                    {time>0 && !run && (
                        <button onClick={()=>{setRun(false);setTime(0);}} className="bg-gray-200 dark:bg-slate-700 px-6 py-3 rounded-xl font-black text-sm text-gray-700 dark:text-gray-300">
                            {isAr?'تصفير':'Reset'}
                        </button>
                    )}
                </div>
            </div>
        </div>
    );
};

const ScrollPicker=({min,max,val,onCh,lbl,suf})=>{const opts=Array.from({length:max-min+1},(_,i)=>min+i);const ref=useRef(null);return(<div className="flex flex-col items-center flex-1 bg-white p-2 rounded-[1.5rem] shadow-sm overflow-hidden"><span className="text-[10px] font-bold text-gray-500 mb-1 whitespace-nowrap">{lbl}</span><div ref={ref} onScroll={(e)=>onCh(opts[Math.round(e.target.scrollTop/44)]||val)} className="h-[132px] w-full overflow-y-scroll scroll-picker relative"><div style={{height:'44px'}}></div>{opts.map(o=><div key={o} onClick={()=>{onCh(o);ref.current.scrollTo({top:(o-min)*44,behavior:'smooth'});}} className={`h-[44px] flex items-center justify-center scroll-picker-item cursor-pointer transition-all ${val===o?'text-brand text-2xl font-black scale-110':'text-gray-300 text-sm font-bold'}`}>{o} <span className="text-[10px] ml-1">{suf}</span></div>)}<div style={{height:'44px'}}></div></div></div>);};
